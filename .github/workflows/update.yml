name: update-dashboard
on:
  schedule:
    - cron: "*/10 13-21 * * 1-5"   # every 10 min, US pre-market through close (UTC)
    - cron: "30 22 * * 1-5"         # after close: final daily numbers
    - cron: "0 6 * * *"             # daily keep-alive refresh
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install cryptography==43.0.3
      - name: Pull prices and compute
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
          DASH_PASS: ${{ secrets.DASH_PASS }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python portfolio-control/scripts/update.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: portfolio-control/site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
